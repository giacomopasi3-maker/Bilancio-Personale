<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Bilancio Personale</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--in:#15803d;--out:#be123c;--sav:#6d28d9}
@media(prefers-color-scheme:dark){:root{--bg:#0b1117;--card:#151d26;--tx:#e6edf3;--mut:#8b98a5;--line:#243040;--pri:#2dd4bf;--in:#4ade80;--out:#fb7185;--sav:#a78bfa}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .card{margin:0;padding:10px}.grid small{color:var(--mut);display:block}.grid b{font-size:15px}
.big{font-size:28px;font-weight:700;margin:2px 0}.in{color:var(--in)}.out{color:var(--out)}.sav{color:var(--sav)}.mut{color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--pri);opacity:.85;margin-top:4px}.bar.s{background:var(--sav)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border:0}
.row small{display:block;color:var(--mut)}.row>span{white-space:nowrap;font-weight:600}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.d{color:var(--out)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 10px}
label{font-size:12px;color:var(--mut)}.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:3px 4px 3px 0;font-size:13px;cursor:pointer}
.tools{display:flex;gap:8px}.tools>*{margin:0 0 10px}
nav{position:fixed;z-index:5;background:var(--card);border-top:1px solid var(--line);bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:56px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--pri);font-weight:600}
nav .fab{background:var(--pri);color:#fff;width:52px;height:52px;border-radius:50%;font-size:26px;margin-top:-22px;min-width:0;justify-content:center;box-shadow:0 4px 14px #0004}
#modal{position:fixed;inset:0;background:#0007;z-index:10;display:none;align-items:flex-end;justify-content:center}#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
@media(min-width:820px){nav{top:0;bottom:auto;right:auto;width:92px;height:100vh;flex-direction:column;justify-content:flex-start;gap:14px;padding-top:24px;border:0;border-right:1px solid var(--line)}nav .fab{margin:0}main{margin-left:120px;max-width:820px}#modal{align-items:center}.sheet{border-radius:20px}}
</style></head><body>
<main id="main"></main>
<nav id="nav"></nav><div id="modal"></div><input type="file" id="file" accept=".json" hidden>
<script>
'use strict';
/* ===== Utilità: importi in CENTESIMI interi (nessun errore di arrotondamento), formati italiani ===== */
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}), eur=c=>EUR.format(c/100);
const itDate=s=>s.split('-').reverse().join('/'), pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const shift=(ym,n)=>{const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>{const[y,m]=ym.split('-');return`${MESI[m-1]} ${y}`};
/* Accetta anche somme come nel tuo Excel: "50+20,5+30" -> centesimi. Niente eval. */
function parseAmount(s){s=String(s).replace(/\s/g,'').replace(/,/g,'.');
  if(!/^\d+(\.\d+)?(\+\d+(\.\d+)?)*$/.test(s))return null;
  return s.split('+').reduce((t,x)=>t+Math.round(parseFloat(x)*100),0)}

/* ===== Categorie di partenza: ESATTAMENTE quelle del tuo Excel (nomi più recenti) ===== */
const SEED=[['CASA','expense',['Mutuo','Elettricità','Gas','Acqua','Internet','Tassa rifiuti','Manutenzione e riparazioni','Pulizie / Personale di servizio','Altro']],
['COMUNICAZIONE','expense',['Cellulare','Altro']],['TRASPORTI','expense',['Autobus/taxi/treno','Autostrada','Carburante','Manutenzione','Parcheggio','Altro']],
['ALIMENTAZIONE','expense',['Alimentari','Ristoranti','Divertimento']],['CURA PERSONALE','expense',['Abbigliamento','Parrucchiere','Estetista','Lavanderia','Palestra','Club o associazioni','Altro']],
['SPESE MEDICHE','expense',['Medicinali','Pediatra','Dentista','Oculista','Analisi Cliniche','Visite specialistiche','Altro']],['TEMPO LIBERO','expense',['Streaming','Viaggi','Cinema','Concerti','Eventi sportivi','Teatro','Altro']],
['RISPARMI O INVESTIMENTI','saving',['Fondo pensionistico','Investimento PAC','Crypto','Altro']],['REGALI E DONAZIONI','expense',['Regali','Beneficenza','Altro']],
['ENTRATE','income',['Stipendio','Paolino','Entrata extra','Ticket pasto']]];

/* ===== Database locale (IndexedDB). Gli aggiornamenti dell'app NON toccano i dati: se servirà cambiare
   struttura si alza la versione e si MIGRA in onupgradeneeded, senza mai cancellare gli store. ===== */
const DB={db:null,
 open(){return new Promise((ok,ko)=>{const r=indexedDB.open('bilancio',1);
  r.onupgradeneeded=()=>{const d=r.result;['tx','cats','accts'].forEach(s=>d.createObjectStore(s,{keyPath:'id',autoIncrement:true}))};
  r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>ko(r.error)})},
 run(s,mode,fn){return new Promise((ok,ko)=>{const t=this.db.transaction(s,mode),q=fn(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})},
 all:s=>DB.run(s,'readonly',o=>o.getAll()),put:(s,x)=>DB.run(s,'readwrite',o=>o.put(x)),del:(s,id)=>DB.run(s,'readwrite',o=>o.delete(id)),clear:s=>DB.run(s,'readwrite',o=>o.clear())};

const S={cats:[],accts:[],tx:[],view:'home',ym:ymd(new Date()).slice(0,7),q:'',ft:''};
const catOf=id=>S.cats.find(c=>c.id===id), accName=id=>(S.accts.find(a=>a.id===id)||{}).name||'—';
const subName=x=>{const c=catOf(x.catId),s=c&&c.subs.find(s=>s.id===x.subId);return s?s.name:''};
async function reload(){[S.cats,S.accts,S.tx]=await Promise.all([DB.all('cats'),DB.all('accts'),DB.all('tx')]);S.tx.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}

/* ===== Calcoli. Trasferimenti esclusi da entrate/spese; i "previsti" non entrano nei totali effettivi;
   i risparmi sono separati dalle spese (scelta tua). ===== */
function totals(l){const t={in:0,out:0,sav:0,pin:0,pout:0,by:{}};
 for(const x of l){if(x.type==='transfer')continue;
  if(x.planned){if(x.type==='in')t.pin+=x.cents;else t.pout+=x.cents;continue}
  if(x.type==='in'){t.in+=x.cents;continue}
  const c=catOf(x.catId);if(c&&c.kind==='saving')t.sav+=x.cents;else t.out+=x.cents;t.by[x.catId]=(t.by[x.catId]||0)+x.cents}
 return t}
const inMonth=ym=>S.tx.filter(x=>x.date.startsWith(ym));
function balance(id){let b=0;for(const x of S.tx){if(x.planned)continue;
  if(x.type==='in'&&x.accId===id)b+=x.cents;else if(x.type==='out'&&x.accId===id)b-=x.cents;
  else if(x.type==='transfer'){if(x.accId===id)b-=x.cents;if(x.toAccId===id)b+=x.cents}}return b}

/* ===== Viste ===== */
const monthBar=()=>`<div class="mn"><button class="btn" data-act="prev">‹</button><b>${ymLabel(S.ym)}</b><button class="btn" data-act="next">›</button></div>`;
function rowHTML(x){const c=catOf(x.catId),sv=c&&c.kind==='saving',tr=x.type==='transfer';
 const cls=x.type==='in'?'in':tr?'mut':sv?'sav':'out',sg=x.type==='in'?'+':tr?'⇄':'−';
 const t=x.desc||subName(x)||(tr?'Trasferimento':'Movimento');
 const meta=[itDate(x.date),tr?`${accName(x.accId)} → ${accName(x.toAccId)}`:`${c?c.name:''}${subName(x)?' · '+subName(x):''} · ${accName(x.accId)}`,x.planned?'previsto':''].filter(Boolean).join(' · ');
 return`<div class="row" data-act="edit" data-id="${x.id}"><div><b>${esc(t)}</b><small>${esc(meta)}</small></div><span class="${cls}">${sg} ${eur(x.cents)}</span></div>`}
function home(){const m=totals(inMonth(S.ym)),p=totals(inMonth(shift(S.ym,-1))),saldo=m.in-m.out-m.sav;
 const tot=S.tx.reduce((t,x)=>x.planned||x.type==='transfer'?t:t+(x.type==='in'?x.cents:-x.cents),0);
 const d=m.out-p.out,max=Math.max(1,...Object.values(m.by));
 const cats=Object.entries(m.by).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{const c=catOf(+id)||catOf(id);return`<div style="margin:8px 0"><div class="row" style="padding:0;border:0;cursor:default"><span style="font-weight:500">${esc(c?c.name:'?')}</span><span>${eur(v)}</span></div><div class="bar ${c&&c.kind==='saving'?'s':''}" style="width:${v/max*100}%"></div></div>`}).join('');
 const y=S.ym.slice(0,4),vals=MESI.map((_,i)=>totals(inMonth(`${y}-${pad(i+1)}`)).out),mx=Math.max(1,...vals);
 const chart=`<svg viewBox="0 0 240 80" width="100%" role="img" aria-label="Spese per mese">${vals.map((v,i)=>`<rect x="${i*20+3}" y="${66-v/mx*60}" width="14" height="${v/mx*60}" rx="3" fill="${`${y}-${pad(i+1)}`===S.ym?'var(--pri)':'var(--line)'}"/><text x="${i*20+10}" y="78" font-size="6" text-anchor="middle" fill="var(--mut)">${MESI[i].slice(0,3)}</text>`).join('')}</svg>`;
 const last=S.tx.filter(x=>!x.planned).slice(0,6).map(rowHTML).join('');
 return`${monthBar()}<div class="card"><small class="mut">Saldo del mese (entrate − spese − risparmi)</small><div class="big ${saldo<0?'out':''}">${eur(saldo)}</div>
 <small class="mut">Spese ${d===0?'invariate':(d>0?'+':'−')+eur(Math.abs(d)).replace('-','')+(d>0?' in più':' in meno')} rispetto a ${ymLabel(shift(S.ym,-1))}</small></div>
 <div class="grid"><div class="card"><small>Entrate</small><b class="in">${eur(m.in)}</b></div><div class="card"><small>Spese</small><b class="out">${eur(m.out)}</b></div><div class="card"><small>Risparmi</small><b class="sav">${eur(m.sav)}</b></div></div>
 ${m.pin+m.pout?`<p class="mut" style="font-size:13px">Previsti (non conteggiati): uscite ${eur(m.pout)}${m.pin?` · entrate ${eur(m.pin)}`:''}</p>`:''}
 <h2>Per categoria</h2><div class="card">${cats||'<div class="empty">Nessuna uscita registrata in questo mese</div>'}</div>
 <h2>Spese ${y}</h2><div class="card">${chart}</div>
 <h2>Ultimi movimenti</h2><div class="card">${last||'<div class="empty">Nessun movimento. Tocca ＋ per aggiungere il primo.</div>'}</div>
 <p class="mut" style="font-size:13px">Saldo complessivo registrato: <b>${eur(tot)}</b></p>`}
function movList(){const q=S.q.toLowerCase();
 const l=inMonth(S.ym).filter(x=>(!S.ft||x.type===S.ft)&&(!q||[x.desc,x.note,subName(x),(catOf(x.catId)||{}).name].join(' ').toLowerCase().includes(q)));
 return l.length?l.map(rowHTML).join(''):'<div class="empty">Nessun movimento</div>'}
const mov=()=>`${monthBar()}<div class="tools"><input id="q" placeholder="Cerca…" value="${esc(S.q)}"><select id="ft" style="width:auto"><option value="">Tutti</option><option value="out"${S.ft==='out'?' selected':''}>Uscite</option><option value="in"${S.ft==='in'?' selected':''}>Entrate</option><option value="transfer"${S.ft==='transfer'?' selected':''}>Trasferimenti</option></select></div><div class="card" id="ml">${movList()}</div>`;
const cat=()=>`<h1>Categorie</h1>${S.cats.map(c=>`<div class="card"><div class="row" style="border:0;padding:0;cursor:default"><b>${esc(c.name)} <small class="mut">${{expense:'spesa',saving:'risparmio',income:'entrata'}[c.kind]}</small></b><span><button class="btn" data-act="rencat" data-id="${c.id}">✎</button> <button class="btn d" data-act="delcat" data-id="${c.id}">✕</button></span></div>
 <div style="margin-top:8px">${c.subs.map(s=>`<span class="chip" data-act="subm" data-id="${c.id}" data-sid="${s.id}">${esc(s.name)}</span>`).join('')}<span class="chip" data-act="addsub" data-id="${c.id}">＋ sottocategoria</span></div></div>`).join('')}<button class="btn p" data-act="addcat">＋ Nuova categoria</button>`;
const more=()=>`<h1>Conti</h1><div class="card">${S.accts.map(a=>`<div class="row" style="cursor:default"><b>${esc(a.name)}</b><span>${eur(balance(a.id))} <button class="btn" data-act="renacc" data-id="${a.id}">✎</button> <button class="btn d" data-act="delacc" data-id="${a.id}">✕</button></span></div>`).join('')}</div><button class="btn p" data-act="addacc">＋ Nuovo conto</button>
 <h1 style="margin-top:26px">Dati e backup</h1><div class="card"><p class="mut" style="margin-top:0">Tutto è salvato solo su questo dispositivo. Fai backup regolari.</p>
 <button class="btn" data-act="exjson">Backup completo (JSON)</button> <button class="btn" data-act="imjson">Ripristina da backup</button> <button class="btn" data-act="excsv">Esporta movimenti (CSV)</button>
 <p class="mut" style="margin-bottom:0;font-size:13px">Importazione/esportazione Excel, Budget e Statistiche complete: prossime fasi.</p></div>`;
const NAV=[['home','🏠','Home'],['mov','☰','Movimenti'],['add','＋',''],['cat','🏷','Categorie'],['more','⚙','Altro']];
function render(){$('#nav').innerHTML=NAV.map(([v,i,l])=>v==='add'?`<button class="fab" data-act="add" aria-label="Nuovo movimento">＋</button>`:`<button class="${S.view===v?'on':''}" data-act="nav" data-v="${v}"><i>${i}</i>${l}</button>`).join('');
 $('#main').innerHTML={home,mov,cat,more}[S.view]()}

/* ===== Form movimento (inserimento rapido) ===== */
let FT='out';
const opts=(l,sel)=>l.map(x=>`<option value="${x.id}"${x.id===sel?' selected':''}>${esc(x.name)}</option>`).join('');
function readForm(){const g=n=>($('#f')?.elements[n]||{}).value;return{id:g('id')?+g('id'):undefined,type:FT,amountStr:g('amt'),catId:g('cat'),subId:g('sub'),accId:g('acc')?+g('acc'):undefined,toAccId:g('to')?+g('to'):undefined,date:g('date'),desc:g('desc'),note:g('note'),planned:$('#f')?.elements.pl.checked}}
function drawForm(d){const cs=S.cats.filter(c=>FT==='in'?c.kind==='income':c.kind!=='income');
 if(FT!=='transfer'){if(!cs.some(c=>String(c.id)===String(d.catId)))d.catId=cs[0]&&cs[0].id;const c=catOf(+d.catId)||catOf(d.catId);if(c&&!c.subs.some(s=>s.id===d.subId))d.subId=c.subs[0]&&c.subs[0].id}
 const c=catOf(+d.catId)||catOf(d.catId),T=[['out','Spesa'],['in','Entrata'],['transfer','Trasferimento']];
 $('#modal').innerHTML=`<form id="f" class="sheet" autocomplete="off"><input type="hidden" name="id" value="${d.id??''}">
 <div class="seg">${T.map(([k,l])=>`<button type="button" class="${FT===k?'on':''}" data-act="ftype" data-t="${k}">${l}</button>`).join('')}</div>
 <label>Importo (puoi scrivere somme: 50+20,5)</label><input name="amt" value="${esc(d.amountStr??(d.cents?String(d.cents/100).replace('.',','):''))}" placeholder="0,00" required>
 ${FT==='transfer'?`<label>Da conto</label><select name="acc">${opts(S.accts,d.accId)}</select><label>A conto</label><select name="to">${opts(S.accts,d.toAccId)}</select>`:
 `<label>Categoria</label><select name="cat" data-redraw>${opts(cs,c&&c.id)}</select><label>Sottocategoria</label><select name="sub">${opts(c?c.subs:[],d.subId)}</select><label>Conto</label><select name="acc">${opts(S.accts,d.accId)}</select>`}
 <label>Data</label><input type="date" name="date" value="${d.date}" required><label>Descrizione</label><input name="desc" value="${esc(d.desc)}"><label>Note</label><textarea name="note" rows="2">${esc(d.note)}</textarea>
 <label><input type="checkbox" name="pl" style="width:auto;margin-right:6px"${d.planned?' checked':''}>Previsto (non ancora speso)</label>
 <div style="display:flex;gap:8px;margin-top:12px"><button class="btn p" style="flex:1">Salva</button><button type="button" class="btn" data-act="cancel">Annulla</button>${d.id?'<button type="button" class="btn d" data-act="del">Elimina</button>':''}</div></form>`;
 $('#modal').classList.add('on');if(!d.id)$('#f').elements.amt.focus()}
function openForm(x){const d=x?{...x}:{date:ymd(new Date()),accId:S.accts[0]&&S.accts[0].id};FT=d.type||'out';drawForm(d)}
const closeForm=()=>$('#modal').classList.remove('on');
async function saveForm(){const d=readForm(),cents=parseAmount(d.amountStr);
 if(!cents){alert('Importo non valido. Usa numeri, anche somme come 50+20,5');return}
 if(FT==='transfer'&&d.accId===d.toAccId){alert('Scegli due conti diversi');return}
 const old=d.id?S.tx.find(x=>x.id===d.id):null;
 const t={...(old||{}),type:FT,cents,date:d.date,accId:d.accId,desc:d.desc.trim(),note:d.note.trim(),planned:!!d.planned};
 if(FT==='transfer'){t.toAccId=d.toAccId;delete t.catId;delete t.subId}else{const c=catOf(+d.catId)||catOf(d.catId);t.catId=c.id;t.subId=d.subId;delete t.toAccId}
 await DB.put('tx',t);await reload();closeForm();render()}

/* ===== Backup / CSV ===== */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csvq=v=>/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
function exportCSV(){const R=[['Data','Tipo','Categoria','Sottocategoria','Descrizione','Conto','Importo','Previsto','Note']];
 for(const x of [...S.tx].reverse())R.push([itDate(x.date),{in:'Entrata',out:'Uscita',transfer:'Trasferimento'}[x.type],(catOf(x.catId)||{}).name||'',subName(x),x.desc||'',x.type==='transfer'?accName(x.accId)+' → '+accName(x.toAccId):accName(x.accId),(x.cents/100).toFixed(2).replace('.',','),x.planned?'sì':'no',x.note||'']);
 download('movimenti.csv','\ufeff'+R.map(r=>r.map(csvq).join(';')).join('\r\n'),'text/csv')}
async function restore(file){try{const j=JSON.parse(await file.text());
  if(!Array.isArray(j.cats)||!Array.isArray(j.accts)||!Array.isArray(j.tx))throw 0;
  if(!confirm('Sostituire TUTTI i dati attuali con questo backup?'))return;
  for(const s of['cats','accts','tx']){await DB.clear(s);for(const x of j[s])await DB.put(s,x)}
  await reload();render();alert('Backup ripristinato')}catch(e){alert('File di backup non valido')}}

/* ===== Eventi ===== */
const H={nav:a=>{S.view=a.v;render()},prev:()=>{S.ym=shift(S.ym,-1);render()},next:()=>{S.ym=shift(S.ym,1);render()},add:()=>openForm(),
 edit:a=>openForm(S.tx.find(x=>x.id==a.id)),ftype:a=>{const d=readForm();FT=a.t;drawForm(d)},cancel:closeForm,
 del:async()=>{const id=+$('#f').elements.id.value;if(confirm('Eliminare questo movimento?')){await DB.del('tx',id);await reload();closeForm();render()}},
 addcat:async()=>{const n=(prompt('Nome categoria')||'').trim();if(!n)return;await DB.put('cats',{name:n,kind:confirm('È una categoria di RISPARMIO? (OK = risparmio, Annulla = spesa)')?'saving':'expense',subs:[{id:uid(),name:'Altro'}]});await reload();render()},
 rencat:async a=>{const c=catOf(+a.id),n=(prompt('Nuovo nome',c.name)||'').trim();if(n){c.name=n;await DB.put('cats',c);render()}},
 delcat:async a=>{const c=catOf(+a.id);if(S.tx.some(x=>x.catId===c.id))return alert('Categoria usata da dei movimenti: non si può eliminare');if(confirm('Eliminare '+c.name+'?')){await DB.del('cats',c.id);await reload();render()}},
 addsub:async a=>{const n=(prompt('Nome sottocategoria')||'').trim();if(!n)return;const c=catOf(+a.id);c.subs.push({id:uid(),name:n});await DB.put('cats',c);render()},
 subm:async a=>{const c=catOf(+a.id),s=c.subs.find(s=>s.id===a.sid),n=prompt('Rinomina (vuoto = elimina)',s.name);if(n===null)return;
  if(n.trim())s.name=n.trim();else if(S.tx.some(x=>x.subId===s.id))return alert('Sottocategoria usata da dei movimenti');else c.subs=c.subs.filter(z=>z!==s);await DB.put('cats',c);render()},
 addacc:async()=>{const n=(prompt('Nome conto')||'').trim();if(n){await DB.put('accts',{name:n});await reload();render()}},
 renacc:async a=>{const x=S.accts.find(z=>z.id==a.id),n=(prompt('Nuovo nome',x.name)||'').trim();if(n){x.name=n;await DB.put('accts',x);render()}},
 delacc:async a=>{const id=+a.id;if(S.tx.some(x=>x.accId===id||x.toAccId===id))return alert('Conto usato da dei movimenti');if(S.accts.length<2)return alert('Serve almeno un conto');if(confirm('Eliminare il conto?')){await DB.del('accts',id);await reload();render()}},
 exjson:()=>download(`backup-bilancio-${ymd(new Date())}.json`,JSON.stringify({app:'bilancio',version:1,exported:new Date().toISOString(),cats:S.cats,accts:S.accts,tx:S.tx}),'application/json'),
 imjson:()=>$('#file').click(),excsv:exportCSV};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&H[a.dataset.act])H[a.dataset.act](a.dataset)});
document.addEventListener('submit',e=>{if(e.target.id==='f'){e.preventDefault();saveForm()}});
document.addEventListener('change',e=>{if(e.target.dataset.redraw!==undefined)drawForm(readForm());if(e.target.id==='ft'){S.ft=e.target.value;$('#ml').innerHTML=movList()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#ml').innerHTML=movList()}});
$('#file').addEventListener('change',e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});

(async()=>{await DB.open();await reload();
 if(!S.cats.length){for(const[n,k,s]of SEED)await DB.put('cats',{name:n,kind:k,subs:s.map(x=>({id:uid(),name:x}))})}
 if(!S.accts.length)await DB.put('accts',{name:'Conto principale'});
 await reload();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
